name: Publish Weekly Highlights 1.11

on:
  push:
    branches: [main]
    paths:
      - VERSION.txt
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-highlights-release-1.11
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact public source commit
        run: |
          git init source
          git -C source remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C source fetch --depth=1 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD
      - name: Verify checksums and run synthetic tests
        working-directory: source
        run: |
          python3 scripts/install_share.py --platform other --verify-only
          python3 -m pip install -r requirements.txt
          python3 -m unittest discover -s tests -v
      - name: Build clean standard and WorkBuddy packages
        working-directory: source
        run: |
          python3 scripts/build_package.py --output-dir "$RUNNER_TEMP/weekly-highlight-release"
          python3 "$RUNNER_TEMP/weekly-highlight-release/standard/weekly-highlight-workflow/scripts/install_share.py" --platform other --verify-only
          python3 "$RUNNER_TEMP/weekly-highlight-release/workbuddy/weekly-highlight-workflow/scripts/install_share.py" --platform other --verify-only
          cd "$RUNNER_TEMP/weekly-highlight-release"
          sha256sum *.zip > SHA256SUMS.txt
      - name: Publish version and verified assets
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(tr -d '\r\n' < VERSION.txt)" = '1.11'
          if gh release view v1.11 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v1.11 already exists; refusing to replace a published version.'
            exit 1
          fi
          gh release create v1.11 \
            "$RUNNER_TEMP/weekly-highlight-release/weekly-highlight-workflow-1.11.zip" \
            "$RUNNER_TEMP/weekly-highlight-release/weekly-highlight-workflow-1.11-workbuddy.zip" \
            "$RUNNER_TEMP/weekly-highlight-release/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Weekly Highlights 1.11' --notes-file .github/RELEASE_NOTES_1.11.md --draft
          gh release edit v1.11 --repo "$GITHUB_REPOSITORY" --draft=false --latest
